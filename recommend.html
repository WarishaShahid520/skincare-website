<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skin Finder | Dermify</title>
  <meta name="description" content="Rule-based, educational skincare recommendations.">
  <!-- Bootstrap 5 + Bootstrap Icons + Google Fonts (loaded from the internet) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="recommend">
  <!-- Navbar is built by js/app.js -->
  <div id="navbar"></div>

  <main>

    <section class="page-header">
      <div class="container">
        <span class="eyebrow">Skin Finder</span>
        <h1 class="mt-2">Find products for your concerns</h1>
        <p class="text-muted" style="max-width:40rem">Select one or more concerns. We match them to product tags using simple rules &mdash; for example, <em>if Acne is selected, show products tagged Acne</em>.</p>
      </div>
    </section>

    <section class="pt-0">
      <div class="container">
        <div class="glass p-4 mb-4">
          <h2 class="h5 mb-3">What would you like to focus on?</h2>
          <div class="d-flex flex-wrap gap-2 mb-4" id="concernChips"></div>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-brand" id="showRecs"><i class="bi bi-stars"></i> Show recommendations</button>
            <button class="btn btn-soft" id="clearRecs">Clear</button>
          </div>
          <p class="small text-muted mt-3 mb-0"><i class="bi bi-info-circle"></i> <span id="disclaimerText"></span></p>
        </div>
        <div id="recResults" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <!-- Footer is built by js/app.js -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
