<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Dermify</title>
  <meta name="description" content="Browse, search and filter Dermify skincare products.">
  <!-- Bootstrap 5 + Bootstrap Icons + Google Fonts (loaded from the internet) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="products">
  <!-- Navbar is built by js/app.js -->
  <div id="navbar"></div>

  <main>

    <section class="page-header pb-0">
      <div class="container">
        <span class="eyebrow">Catalogue</span>
        <h1 class="mt-2">Shop all products</h1>
        <p class="text-muted">Search, filter by category and sort by price. Click a product for details.</p>
      </div>
    </section>

    <section class="pt-3">
      <div class="container">
        <!-- Search / sort / filter tools -->
        <div class="shop-tools glass mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-md-6">
              <label for="searchInput" class="visually-hidden">Search products</label>
              <input id="searchInput" type="search" class="form-control" placeholder="Search products (e.g. serum, gel, cream)">
            </div>
            <div class="col-6 col-md-3">
              <label for="sortSelect" class="visually-hidden">Sort products</label>
              <select id="sortSelect" class="form-select">
                <option value="default">Sort: Featured</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
                <option value="name">Name: A to Z</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="stockOnly">
                <label class="form-check-label" for="stockOnly">In stock only</label>
              </div>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-3" id="categoryPills"></div>
        </div>

        <p class="text-muted small" id="resultCount" aria-live="polite"></p>
        <div class="row g-4" id="productGrid"></div>
      </div>
    </section>
  </main>

  <!-- Footer is built by js/app.js -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
